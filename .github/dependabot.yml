# Activate by promoting this file to the repository's default branch.
# Organisation settings must allow Dependabot to read GeospanAI/.agents.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: Development
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    allow:
      - dependency-name: .agents
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(agents)
    labels:
      - "type: chore"
      - "area: agents"
      - "risk: low"
